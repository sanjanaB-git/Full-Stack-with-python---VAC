<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGP Student Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- Page Header -->
        <header class="text-center mb-4">
            <h1 class="text-primary fw-bold display-5">Student Portal</h1>
            <hr class="w-50 mx-auto border-2 border-primary opacity-75">
        </header>

        <!-- Registration Card -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-info text-dark">
                <h2 class="h4 mb-0">Student Registration Form</h2>
            </div>
            <div class="card-body p-4">
                <form action="/student/register" method="POST">
                    <div class="mb-3">
                        <label for="studentName" class="form-label fw-semibold">Student Name</label>
                        <input type="text" class="form-control" name="studentName" placeholder="Enter name" required>
                    </div>

                    <div class="mb-3">
                        <label for="studentEmail" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" name="studentEmail" placeholder="Enter email" required>
                    </div>

                    <div class="mb-3">
                        <label for="studentPhone" class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" class="form-control" name="studentPhone" placeholder="Enter phone number">
                    </div>
                    
                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <select class="form-select" name="department">
                            <option selected disabled>Select Department</option>
                            <option value="CSE">Computer Science Engineering</option>
                            <option value="IT">Information Technology</option>
                            <option value="ECE">Electronics and Communication Engineering</option>
                            <option value="CSBS">CSBS</option>
                            <option value="AIDS">AIDS</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender"  value="Male">
                            <label class="form-check-label" for="genderMale">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female">
                            <label class="form-check-label" for="genderFemale">Female</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold d-block">Skills</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="C">
                                <label class="form-check-label" for="skillC">C</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="C++">
                                <label class="form-check-label" for="skillCpp">C++</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="Java">
                                <label class="form-check-label" for="skillJava">Java</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="Python">
                                <label class="form-check-label" for="skillPython">Python</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="HTML">
                                <label class="form-check-label" for="skillHTML">HTML</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"  name="skills" value="CSS">
                                <label class="form-check-label" for="skillCSS">CSS</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="skills" value="JavaScript">
                                <label class="form-check-label" for="skillJS">JavaScript</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Register</button>
                        <button type="reset" class="btn btn-outline-secondary">Reset</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Student Details Table Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h2 class="h4 mb-0">Student Details</h2>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1001</td>
                                <td>san</td>
                                <td>san@ngp.in</td>
                                <td>Computer Science Engineering</td>
                            </tr>
                            <tr>
                                <td>1002</td>
                                <td>sanjana</td>
                                <td>sanjana@ngp.in</td>
                                <td>Information Technology</td>
                            </tr>
                            <tr>
                                <td>1003</td>
                                <td>sana</td>
                                <td>sana@ngp.in</td>
                                <td>Electronics and Communication Engineering</td>
                            </tr>    
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-5 pt-3 border-top text-center text-muted">
            <p>&copy; 2026 NGP Student Portal.</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
</body>
</html>
