<!DOCTYPE html>
<html>

<head>

<title>Ticket Assignment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4">

<h3>Assign Ticket</h3>

<form action="/assign_ticket" method="POST">

<div class="mb-3">

<label>Ticket Title</label>

<input
type="text"
class="form-control"
name="title">

</div>

<div class="mb-3">

<label>Assign To</label>

<input
type="text"
class="form-control"
name="assigned">

</div>

<button class="btn btn-primary">

Assign

</button>

<a href="/" class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</body>

</html>
